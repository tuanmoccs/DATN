server {
    listen 80;
    server_name localhost;
    
    # Root folder for Laravel public files (needed so Nginx can locate index.php and static resources)
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # 1. Route for Laravel Storage uploaded files
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
    }

    # 2. Route for Laravel Backend API
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. Handle PHP files for Laravel
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 4. Route for Teacher Website (Vue Frontend)
    # Any other route will be handled by the frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disallow access to hidden files
    location ~ /\.ht {
        deny all;
    }
}
